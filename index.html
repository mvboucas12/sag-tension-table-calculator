<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabela de Esticamento de Cabos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
/* ===== FIX LAYOUT GLOBAL ===== */
.results-panel {
  min-height: 300px;
  width: 100%;
}

/* trava largura do card */
#results-card {
  width: 100%;
  max-width: 100%;
}

/* impede tabela iterativa de afetar layout */
.iter-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

/* ===== RESTANTE ORIGINAL ===== */

body { font-family: Arial; background:#edf2f7; }

.container {
  max-width: 1100px;
  margin:auto;
  display:grid;
  grid-template-columns: 340px 1fr;
  gap:20px;
}

.card { background:white; padding:15px; border-radius:8px; }

.field { margin-bottom:10px; }

button { padding:10px; width:100%; cursor:pointer; }

table {
  width:100%;
  border-collapse: collapse;
}

th, td {
  padding:8px;
  text-align:center;
  border-bottom:1px solid #ddd;
}

thead {
  background:#2E75B6;
  color:white;
}

.iter-table { font-size:12px; }

</style>
</head>

<body>

<div class="container">

<!-- ===== INPUT ===== -->
<div class="card">

<h3>Dados de Entrada</h3>

<div class="field">
<label>S (m)</label>
<input type="number" id="S" value="500">
</div>

<div class="field">
<label>D (m)</label>
<input type="number" id="D" value="10">
</div>

<div class="field">
<label>W (kg/m)</label>
<input type="number" id="W" value="1.628">
</div>

<div class="field">
<label>A (mm²)</label>
<input type="number" id="A" value="423.24">
</div>

<div class="field">
<label>E (kgf/mm²)</label>
<input type="number" id="E" value="65000">
</div>

<div class="field">
<label>α</label>
<input type="number" id="alpha" value="0.0000193">
</div>

<div class="field">
<label>H₀ (kgf)</label>
<input type="number" id="H0" value="3000">
</div>

<div class="field">
<label>t₀</label>
<input type="number" id="t0" value="25">
</div>

<!-- NOVO INPUT -->
<div class="field">
<label>Cabos por fase (n)</label>
<input type="number" id="nCabos" value="1" min="1">
</div>

<div class="field">
<label>t_min</label>
<input type="number" id="tmin" value="0">
</div>

<div class="field">
<label>t_max</label>
<input type="number" id="tmax" value="90">
</div>

<div class="field">
<label>Δt</label>
<input type="number" id="dt" value="5">
</div>

<button onclick="calcular()">Calcular</button>

</div>

<!-- ===== RESULTADOS ===== -->
<div class="results-panel">

<div id="results-card">

<h3>Tabela de Esticamento</h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Temp (°C)</th>
<th>Tração por cabo (kgf)</th>
<th>Tração total (kgf)</th>
<th>Flecha (m)</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<!-- ITERAÇÃO -->
<button onclick="toggleIter()">▶ Ver Newton-Raphson</button>

<div class="iter-table-wrap" id="iterWrap">
<table class="iter-table">
<thead>
<tr>
<th>n</th>
<th>H</th>
<th>R</th>
<th>H novo</th>
</tr>
</thead>
<tbody id="iterBody"></tbody>
</table>
</div>

</div>

</div>

</div>

<script>

function calcular() {

const S = +S_input();
const D = +val("D");
const W = +val("W");
const A = +val("A");
const E = +val("E");
const alpha = +val("alpha");
const H0 = +val("H0");
const t0 = +val("t0");
const tmin = +val("tmin");
const tmax = +val("tmax");
const dt = +val("dt");
const nCabos = +val("nCabos");

/* estado inicial */
const L0 = Math.sqrt(S*S+D*D)*(1+(W*W*S*S)/(24*H0*H0));
const Te0 = Math.sqrt(H0*H0 + (W*S/2)**2);
const L0s = L0*(1-Te0/(A*E));

let tbody = document.getElementById("tbody");
tbody.innerHTML="";

for(let t=tmin; t<=tmax; t+=dt){

let H = H0;

for(let i=0;i<30;i++){

const Te = Math.sqrt(H*H + (W*S/2)**2);
const Lcat = Math.sqrt(S*S+D*D)*(1+(W*W*S*S)/(24*H*H));
const Lest = L0s*(1+alpha*(t-t0)+Te/(A*E));

const R = Lcat - Lest;

const dR = (-W*W*S*S)/(12*H**3);

const Hn = H - R/dR;

if(Math.abs(Hn-H)<1e-6) break;

H = Hn;
}

const F = W*S*S/(8*H);

/* NOVA LÓGICA */
const H_por_cabo = H;
const H_total = H * nCabos;

tbody.innerHTML += `
<tr>
<td>${t}</td>
<td>${H_por_cabo.toFixed(1)}</td>
<td><b>${H_total.toFixed(1)}</b></td>
<td>${F.toFixed(3)}</td>
</tr>`;
}

}

/* helpers */
function val(id){ return document.getElementById(id).value }
function S_input(){ return document.getElementById("S").value }

/* iter */
function toggleIter(){
const el = document.getElementById("iterWrap");
el.style.display = el.style.display==="block"?"none":"block";
}

</script>

</body>
</html>
